"""

# ============================================
# 2. COLORES (Cyberdream)
# ============================================
[palettes.cyberdream]
text         = '#c7cfff'
#overlay1     = '#404A63'
#overlay1     = '#ABF668'
color_fg0    = '#c7cfff'
color_bg0    = '#0a0e14'
color_blue   = '#5ea1ff'
color_green  = '#5eff6c'
color_orange = '#ffb65e'
color_red    = '#ff6e5e'
color_yellow = '#f1ff5e'
color_pink   = '#ff5ea0'
color_purple = '#bd5eff'
color_aqua   = '#5ef1ff'

# ============================================
# 3. IDENTIDAD Y OS
# ============================================

[os]
disabled = false
style = "bold white"
format = '$symbol'

[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = " "
Artix = " "
CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = "󰛓 "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = "󰈸 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
Nobara = " "
OpenBSD = "󰈺 "
openSUSE = " "
OracleLinux = "󰌷 "
Pop = " "
Raspbian = " "
Redhat = " "
RedHatEnterprise = " "
RockyLinux = " "
Redox = "󰀘 "
Solus = "󰠳 "
SUSE = " "
Ubuntu = " "
Unknown = " "
Void = " "
Windows = "󰍲 "

[username]
disabled = false
style_user = 'bold color_blue'
style_root = 'bold color_red'
format = '[$user]($style)'
show_always = true

[hostname]
disabled = true

[directory]
style = "bold color_purple"
format = '[$path]($style)'
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"

# ============================================
# 4. GIT
# ============================================

[git_branch]
symbol = " "
style = "bold color_pink"
format = ' [](bold color_aqua) [$symbol$branch]($style)'

[git_status]
style = "bold color_red"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "conflicto"
up_to_date = "" 

format = '( [\[$all_status$ahead_behind\]]($style))'

