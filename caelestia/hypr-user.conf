xwayland {
  force_zero_scaling = true
}

device {
    name = mouse-passthrough
    natural_scroll = true
    scroll_factor = 5.0
}

device {
    name = mouse-passthrough-(absolute)
    natural_scroll = true
    scroll_factor = 5.0
}

device {
    name = unknown-device
    natural_scroll = true
    scroll_factor = 5.0
}

# Caelestia whiteboard rules
windowrule = float true, match:title Caelestia Whiteboard













