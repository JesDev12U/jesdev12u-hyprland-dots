xwayland {
  force_zero_scaling = true
}

device {
    name = mouse-passthrough
    natural_scroll = true
    scroll_factor = 5.0
}

device {
    name = mouse-passthrough-(absolute)
    natural_scroll = true
    scroll_factor = 5.0
}

device {
    name = unknown-device
    natural_scroll = true
    scroll_factor = 5.0
}

# Lorien whiteboard rules
windowrule = workspace special:whiteboard, match:class Lorien





